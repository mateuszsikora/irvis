# Netlify builds apps/web: production from the release branch only, and a
# deploy preview for every pull request. Why and how:
# docs/features/web-app-technical.md#netlify

[build]
  command = "npm run build --workspace @irvis/web"
  publish = "apps/web/dist"

# Production deploys cost credits on the free plan, so production builds only
# from release, which the "Promote to release" workflow moves. If the site's
# production branch is ever set to another branch, its builds are cancelled
# here (exit code 0 from the ignore command cancels the build).
[context.production]
  ignore = 'test "$BRANCH" != "release"'
