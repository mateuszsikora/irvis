# What runs here and why: docs/guides/development.md#ci
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Documentation contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The check diffs against the merge base; a shallow clone has none.
          fetch-depth: 0
      # Node only: the check imports nothing but Node built-ins, so no npm ci.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Documentation contract
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run docs-check -- --base "origin/$BASE_REF"

  integrity:
    name: Documentation integrity
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Documentation integrity
        run: npm run docs-check -- --integrity-only

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
