# Moves the release branch, which Netlify publishes to production, to a commit
# on main. Runs by hand, and from the Release workflow when a release is
# published.
# Why and how: docs/guides/development.md#promote-to-release
name: Promote to release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to publish (empty for the tip of main)
        required: false
        default: ''
  workflow_call:
    inputs:
      sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  promote:
    name: Promote to release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    # On the job, so that runs by hand and from Release share one queue.
    concurrency:
      group: promote-to-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # merge-base --is-ancestor needs the history of main.
          fetch-depth: 0
      - name: Fast-forward release
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -eu
          # Catches a run started from another branch by mistake. It is not a
          # security boundary: that branch's copy of this file can drop it.
          # Release calls this workflow when a release of a tag v* is published;
          # the checks below still require its commit to be on main.
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            workflow_dispatch:refs/heads/main | release:refs/tags/v*) ;;
            *)
              echo "::error::run this workflow from main, not from $GITHUB_REF"
              exit 1
              ;;
          esac
          if [ -n "$SHA" ] && ! printf '%s' "$SHA" | grep -Eqx '[0-9a-f]{7,40}'; then
            echo "::error::the sha input must be 7 to 40 lowercase hexadecimal digits"
            exit 1
          fi
          git fetch origin main
          sha=$(git rev-parse --verify --quiet "${SHA:-origin/main}^{commit}") || {
            echo "::error::$SHA is not a commit in this repository"
            exit 1
          }
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main; only commits on main are published"
            exit 1
          fi
          # No --force: the push fails unless release fast-forwards to $sha.
          git push origin "$sha:refs/heads/release"
          echo "release is now $sha" >> "$GITHUB_STEP_SUMMARY"
