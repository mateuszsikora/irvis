# Run by hand from main: sets the version through a pull request, builds the
# desktop packages and leaves a draft GitHub Release with them and the source
# of the LGPL parts they carry (ffmpeg, and libusb inside node-usb).
# Publishing that release moves the release branch for Netlify.
# Why and how: docs/guides/development.md#release
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, such as 0.2.0 or 0.2.0-rc.1 (empty for the next patch version)
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Set the version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # The tip of main when the job starts, not the commit the run was
      # started on: a queued run or a rerun then sees an earlier run's version.
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/main
      - name: Choose the version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          set -eu
          # Catches a run started from another branch by mistake. It is not a
          # security boundary: that branch's copy of this file can drop it.
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::run this workflow from main, not from $GITHUB_REF"
            exit 1
          fi
          current=$(node -p "require('./apps/desktop/package.json').version")
          if [ -n "$INPUT" ]; then
            version=${INPUT#v}
          elif [ "${current#*-}" != "$current" ]; then
            # The next patch version of 0.2.0-rc.1 is 0.2.0, as in npm version patch.
            version=${current%%-*}
          else
            IFS=. read -r major minor patch <<< "$current"
            version="$major.$minor.$((patch + 1))"
          fi
          # Semantic versioning 2.0.0 without build metadata: no leading zeros
          # in numbers, no empty prerelease identifiers.
          number='(0|[1-9][0-9]*)'
          id="($number|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          if ! printf '%s' "$version" | grep -Eqx "$number\.$number\.$number(-$id(\.$id)*)?" ||
            ! git check-ref-format "refs/heads/chore/release-$version"; then
            echo "::error::$version is not a version: use <major>.<minor>.<patch>, optionally with -<prerelease>"
            exit 1
          fi
          # Semantic version precedence: exits 1 when the first is lower.
          if ! node -e '
            const parse = (v) => {
              const dash = v.indexOf("-");
              const core = (dash < 0 ? v : v.slice(0, dash)).split(".").map(Number);
              return { core, pre: dash < 0 ? null : v.slice(dash + 1).split(".") };
            };
            const compare = (a, b) => {
              for (let i = 0; i < 3; i++) if (a.core[i] !== b.core[i]) return a.core[i] - b.core[i];
              if (a.pre === null || b.pre === null) return (a.pre === null) - (b.pre === null);
              for (let i = 0; i < Math.max(a.pre.length, b.pre.length); i++) {
                const [x, y] = [a.pre[i], b.pre[i]];
                if (x === undefined || y === undefined) return x === undefined ? -1 : 1;
                if (x === y) continue;
                const [nx, ny] = [/^[0-9]+$/.test(x), /^[0-9]+$/.test(y)];
                if (nx && ny) return Number(x) - Number(y);
                if (nx || ny) return nx ? -1 : 1;
                return x < y ? -1 : 1;
              }
              return 0;
            };
            process.exit(compare(parse(process.argv[1]), parse(process.argv[2])) < 0 ? 1 : 0);
          ' "$version" "$current"; then
            echo "::error::$version is lower than the current version $current"
            exit 1
          fi
          # 2: no such tag; anything else is a failed connection.
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            echo "::error::the tag v$version already exists: choose another version"
            exit 1
          elif [ "$rc" != 2 ]; then
            echo "::error::could not list the tags of origin (git ls-remote exited with $rc)"
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "current=$current"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Merge the version pull request
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.version.outputs.current }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "apps/desktop/package.json already holds $VERSION; no pull request" >> "$GITHUB_STEP_SUMMARY"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="chore/release-$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::error::the branch $branch is left from an earlier run: close its pull request if it has one, delete the branch and run again"
            exit 1
          fi
          # Both files are what JSON.stringify writes, as npm writes them.
          node -e '
            const fs = require("node:fs");
            const edit = (file, set) => {
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              set(json);
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            };
            const version = process.argv[1];
            edit("apps/desktop/package.json", (p) => { p.version = version; });
            edit("package-lock.json", (l) => { l.packages["apps/desktop"].version = version; });
          ' "$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -q -m "chore(release): set the version to $VERSION" \
            -m "The Release workflow builds the draft release v$VERSION from this commit." \
            -- apps/desktop/package.json package-lock.json
          git push origin "$branch"
          # Without a pull request the branch would block the next run.
          if ! url=$(gh pr create --base main --head "$branch" \
            --title "chore(release): set the version to $VERSION" \
            --body "Opened and merged by the Release workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). The draft release v$VERSION is built from the merge commit."); then
            git push origin --delete "$branch"
            echo "::error::could not open the pull request; is \"Allow GitHub Actions to create and approve pull requests\" on?"
            exit 1
          fi
          # GitHub computes mergeability after the pull request is opened.
          # A pull request opened with GITHUB_TOKEN starts no CI, so the
          # required checks of .github/rulesets/main.json never report;
          # --admin merges through the ruleset's bypass for GitHub Actions.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$url" --squash --admin; then break; fi
            if [ "$attempt" = 5 ]; then
              echo "::error::could not merge $url"
              exit 1
            fi
            sleep 5
          done
          sha=$(gh pr view "$url" --json mergeCommit --jq .mergeCommit.oid)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Merged $url as $sha" >> "$GITHUB_STEP_SUMMARY"

  packages:
    name: Packages
    needs: version
    # Every package carries its ffmpeg: a failed ffmpeg build stops the release.
    uses: ./.github/workflows/desktop.yml
    with:
      allow-system-ffmpeg: false
      ref: ${{ needs.version.outputs.sha }}

  draft:
    name: Draft release
    needs: [version, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # By name: desktop.yml names a package without ffmpeg differently, and
      # such a package must never be released.
      - uses: actions/download-artifact@v8
        with:
          name: irvis-mac
          path: assets
      - uses: actions/download-artifact@v8
        with:
          name: irvis-win
          path: assets
      - uses: actions/download-artifact@v8
        with:
          name: irvis-linux
          path: assets
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-source
          path: assets
      # The node-usb prebuilds link libusb (LGPL) statically, so its source
      # goes next to the packages, as ffmpeg's does.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          path: source
          sparse-checkout: |
            .nvmrc
            package-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: source/.nvmrc
      - name: Fetch the node-usb source
        run: |
          set -eu
          read -r version integrity < <(node -p "const u = require('./source/package-lock.json').packages['node_modules/usb']; u.version + ' ' + u.integrity")
          npm pack "usb@$version" --pack-destination assets --json --silent > "$RUNNER_TEMP/usb-pack.json"
          packed=$(node -p "require(process.argv[1])[0].integrity" "$RUNNER_TEMP/usb-pack.json")
          if [ "$packed" != "$integrity" ]; then
            echo "::error::usb-$version.tgz from the registry is not the package in package-lock.json"
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.version.outputs.sha }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -eu
          tag="v$VERSION"
          cd assets
          # Exactly these files are released, whatever else the artifacts hold.
          shopt -s nullglob
          files=()
          for pattern in "irvis-$VERSION-mac-arm64.dmg" "irvis-$VERSION-mac-x64.dmg" \
            "irvis-$VERSION-win-x64.exe" "irvis-$VERSION-win-x64.zip" \
            "irvis-$VERSION-linux-x86_64.AppImage" "irvis-$VERSION-linux-amd64.deb" \
            'ffmpeg-*.tar.xz' build.sh 'usb-*.tgz'; do
            # shellcheck disable=SC2206 # the pattern is meant to expand
            found=($pattern)
            # A name without a wildcard stays as it is even when the file is missing.
            if [ "${#found[@]}" = 1 ] && [ ! -f "${found[0]}" ]; then found=(); fi
            if [ "${#found[@]}" != 1 ]; then
              echo "::error::the packages hold ${#found[@]} files matching $pattern instead of one"
              exit 1
            fi
            files+=("${found[0]}")
          done
          # A draft has no tag yet; an earlier run's draft of the same version is replaced.
          for id in $(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$tag\") | .id"); do
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          done
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          url=$(gh release create "$tag" "${files[@]}" --draft --target "$SHA" "${flags[@]}" \
            --title "irvis $VERSION" --generate-notes \
            --notes "Unsigned desktop packages for macOS, Windows and Linux; how to install them: $GITHUB_SERVER_URL/$GH_REPO/blob/$tag/docs/features/desktop-user.md#install-a-package. Each package carries an LGPL ffmpeg and node-usb with the LGPL libusb built in; the ffmpeg source tarball, its build.sh and the node-usb source package with libusb are attached.")
          if [ "$PRERELEASE" = true ]; then
            next="Publish it to tag $SHA; as a prerelease it does not move release."
          else
            next="Publish it to tag $SHA and move release."
          fi
          echo "Draft release $tag: $url. $next" >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote to release
    # A prerelease does not reach production.
    if: >-
      github.event_name == 'release' && !github.event.release.prerelease &&
      startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/promote.yml
    permissions:
      contents: write
    with:
      sha: ${{ github.sha }}
